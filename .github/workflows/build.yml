name: Build RoomInfo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/HowToFish.RoomInfo.csproj -c Release --nologo

      - name: Verify output
        run: |
          test -f src/bin/Release/HowToFish.RoomInfo.dll
          sha256sum src/bin/Release/HowToFish.RoomInfo.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: HowToFish.RoomInfo
          path: src/bin/Release/HowToFish.RoomInfo.dll
          if-no-files-found: error
